[project]
name = "personal-finance-app"
version = "0.1.0"
description = "Simple personal finance tracker built with Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "plotly==7.1.0",
    "google-genai==3.6.1",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "flake8",
]

[tool.uv]
package = false
