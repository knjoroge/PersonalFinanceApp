name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install packages
        run: uv sync --locked
      - name: Check code style
        run: uv run flake8 --max-line-length=120 app.py database.py views/
      - name: Run tests
        run: uv run pytest tests/ -v
